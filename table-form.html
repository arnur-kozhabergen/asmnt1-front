<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnur - Table and Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="table-form.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Arnur Kozhabergen</a>
        <ul class="nav-list">
            <li><a href="index.html">Portfolio</a></li>
            <li><a href="layout.html">Layout</a></li>
            <li><a href="exercise1/index.html">Tribute</a></li>
            <li><a href="table-form.html" class="active">Table &amp; Form</a></li>
            <li><a href="midterm.html">Midterm</a></li>
        </ul>
    </nav>

    <main class="page">
        <h1 id="table-title">Punk Rock School: Report Card</h1>

        <table>
            <tr>
                <th>Student</th>
                <th>Class</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td>Arnur</td>
                <td>Bass Guitar</td>
                <td>A</td>
            </tr>
            <tr class="highlight-row">
                <td>Aru</td>
                <td>Drums</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Timur</td>
                <td>Screaming Vocals</td>
                <td>B</td>
            </tr>
            <tr>
                <td colspan="2">Best student of the year</td>
                <td>Aru</td>
            </tr>
        </table>

        <h2>Concert Feedback</h2>

        <form id="feedback-form">
            <label for="name">Your name</label>
            <input type="text" id="name">

            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="role">Who are you?</label>
            <select id="role">
                <option>Student</option>
                <option>Teacher</option>
                <option>Other</option>
            </select>

            <label>Was the concert loud enough?</label>
            <input type="radio" name="loud" class="radio"> Yes
            <input type="radio" name="loud" class="radio"> No

            <label for="song">Which song should we play next time?</label>
            <textarea id="song"></textarea>

            <button type="submit">Rock on!</button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Arnur Kozhabergen</p>
    </footer>
</body>
</html>
